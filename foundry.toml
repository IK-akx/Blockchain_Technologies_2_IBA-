[profile.default]
src = "src"
out = "out"
libs = ["lib", "lib/openzeppelin-contracts", "lib/openzeppelin-contracts-upgradeable", "lib/forge-std", "lib/chainlink-brownie-contracts"]
test = "test"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Для coverage и отчетов
gas_reports = ["*"]