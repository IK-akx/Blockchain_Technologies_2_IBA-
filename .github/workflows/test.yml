name: CI

permissions: {}

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry + Slither + Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # ----- Foundry setup -----
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # ----- Linting -----
      - name: Run Forge fmt
        run: forge fmt --check

      # ----- Solhint (Solidity linter) -----
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install solhint
        run: npm install -g solhint

      - name: Run solhint
        run: solhint "src/**/*.sol"

      # ----- Build -----
      - name: Run Forge build
        run: forge build --sizes

      # ----- Tests (unit + fuzz + invariant + fork) -----
      - name: Run Forge tests
        run: forge test -vvv

      # ----- Coverage (≥90% required) -----
      - name: Run Forge coverage
        run: forge coverage --report lcov

      # Upload coverage report as artifact (for checking)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

      # ----- Slither (static analysis) -----
      - name: Install Slither
        run: |
          pip install slither-analyzer
          pip install solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Slither
        run: slither . --config-file slither.config.json --checklist --json slither-output.json
        continue-on-error: false   

      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither-output.json